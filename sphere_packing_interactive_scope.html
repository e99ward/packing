<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive Sphere Packing</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #111; color: white; }
        #controls, #right-controls {
            position: absolute; top: 20px;
            background: rgba(0, 0, 0, 0.85); padding: 20px;
            border-radius: 12px; border: 1px solid #444;
            width: 280px; z-index: 100;
            box-shadow: 0 8px 32px rgba(0,0,0,0.5);
            max-height: 90vh;
            overflow-y: auto;
        }
        #controls { left: 20px; }
        #right-controls { right: 20px; }
        
        .control-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9em; color: #aaa; }
        input[type="range"], input[type="number"] { width: 100%; box-sizing: border-box; }
        
        /* Dual Range Slider Styles */
        .range-slider {
            position: relative;
            height: 20px;
            width: 100%;
        }
        .range-slider input {
            position: absolute;
            width: 100%;
            height: 5px;
            background: none;
            pointer-events: none;
            -webkit-appearance: none;
            margin: 0;
            top: 50%;
            transform: translateY(-50%);
        }
        .range-slider input::-webkit-slider-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #3b82f6;
            pointer-events: auto;
            -webkit-appearance: none;
            cursor: pointer;
            box-shadow: 0 0 2px rgba(0,0,0,0.5);
            border: 2px solid white;
        }
        .range-slider input::-moz-range-thumb {
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #3b82f6;
            pointer-events: auto;
            cursor: pointer;
            border: 2px solid white;
        }
        /* Track background */
        .slider-track {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            width: 100%;
            height: 4px;
            background: #444;
            border-radius: 2px;
            z-index: -1;
        }

        button {
            width: 100%; padding: 10px; margin-top: 10px;
            background: #2563eb; color: white; border: none;
            border-radius: 6px; cursor: pointer; font-weight: bold;
            transition: background 0.2s;
        }
        button:hover { background: #1d4ed8; }
        #stats {
            margin-top: 15px; padding-top: 15px;
            border-top: 1px solid #444; font-size: 0.85em;
            line-height: 1.6;
        }
        .stat-val { color: #3b82f6; font-weight: bold; }
        .stat-scope { color: #f87171; font-weight: bold; }
        #info { position: absolute; bottom: 20px; left: 20px; font-size: 0.8em; color: #666; }
    </style>
</head>
<body>

    <div id="controls">
        <h3 style="margin-top:0">Box Configuration</h3>
        
        <div class="control-group">
            <label>Width (X): <span id="val-w">10</span></label>
            <input type="range" id="input-w" min="5" max="30" value="10" step="1">
        </div>
        <div class="control-group">
            <label>Depth (Y): <span id="val-d">10</span></label>
            <input type="range" id="input-d" min="5" max="30" value="10" step="1">
        </div>
        <div class="control-group">
            <label>Max Height (Z): <span id="val-h">10</span></label>
            <input type="range" id="input-h" min="5" max="30" value="10" step="1">
        </div>
        <div class="control-group">
            <label>Mean Radius: <span id="val-r">0.8</span></label>
            <input type="range" id="input-r" min="0.2" max="2.0" value="0.8" step="0.1">
        </div>
        <div class="control-group">
            <label>Radius Std Dev: <span id="val-rsig">0.1</span></label>
            <input type="range" id="input-rsig" min="0.0" max="0.5" value="0.1" step="0.01">
        </div>
        <div class="control-group">
            <label>Spheres to Fill: <span id="val-n">50</span></label>
            <input type="range" id="input-n" min="1" max="500" value="50" step="1">
        </div>

        <button id="btn-generate">Generate Packing</button>

        <div id="stats">
            <div>Actual Spheres: <span id="stat-count" class="stat-val">0</span></div>
            <div>Highest Point: <span id="stat-height" class="stat-val">0.00</span></div>
            <div>Global Filling Ratio: <span id="stat-ratio" class="stat-val">0.00%</span></div>
        </div>
    </div>

    <div id="right-controls">
        <h3 style="margin-top:0">Scoping Cube</h3>
        
        <div class="control-group">
            <label>Scope X Range: <span id="val-sx">2.5 - 7.5</span></label>
            <div class="range-slider">
                <div class="slider-track"></div>
                <input type="range" id="input-sx-min" min="0" max="30" value="2.5" step="0.5">
                <input type="range" id="input-sx-max" min="0" max="30" value="7.5" step="0.5">
            </div>
        </div>
        
        <div class="control-group">
            <label>Scope Y Range: <span id="val-sy">2.5 - 7.5</span></label>
            <div class="range-slider">
                <div class="slider-track"></div>
                <input type="range" id="input-sy-min" min="0" max="30" value="2.5" step="0.5">
                <input type="range" id="input-sy-max" min="0" max="30" value="7.5" step="0.5">
            </div>
        </div>
        
        <div class="control-group">
            <label>Scope Z Range: <span id="val-sz">0.0 - 5.0</span></label>
            <div class="range-slider">
                <div class="slider-track"></div>
                <input type="range" id="input-sz-min" min="0" max="30" value="0.0" step="0.5">
                <input type="range" id="input-sz-max" min="0" max="30" value="5.0" step="0.5">
            </div>
        </div>

        <div id="stats" style="border-top: 1px solid #444; margin-top: 15px; padding-top: 15px;">
            <div>Scoping Density: <span id="stat-scope-ratio" class="stat-scope">0.00%</span></div>
        </div>
    </div>

    <div id="info">Left click: Rotate | Right click: Pan | Scroll: Zoom</div>


    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // --- Packing Logic ---
        class SpherePacker {
            constructor(W, D, H, meanR, stdR) {
                this.W = W; this.D = D; this.H = H; 
                this.meanR = meanR; this.stdR = stdR;
                this.spheres = [];
            }

            // Normal distribution using Box-Muller transform
            randomNormal(mean, std) {
                let u = 0, v = 0;
                while(u === 0) u = Math.random();
                while(v === 0) v = Math.random();
                let val = Math.sqrt(-2.0 * Math.log(u)) * Math.cos(2.0 * Math.PI * v);
                return val * std + mean;
            }

            getZAt(x, y, currentR) {
                let minZ = currentR;
                for (const s of this.spheres) {
                    const dx = x - s.x;
                    const dy = y - s.y;
                    const dxy2 = dx*dx + dy*dy;
                    const combinedR = currentR + s.r;
                    if (dxy2 < combinedR * combinedR) {
                        const dz = Math.sqrt(combinedR * combinedR - dxy2);
                        minZ = Math.max(minZ, s.z + dz);
                    }
                }
                return minZ;
            }

            addSphere() {
                let r = -1;
                while (r <= 0.05) { // Ensure a minimum physical radius
                    r = this.randomNormal(this.meanR, this.stdR);
                }

                let bestX = 0, bestY = 0, bestZ = Infinity;
                const numTries = 15;
                for (let i = 0; i < numTries; i++) {
                    let curX = r + Math.random() * (this.W - 2 * r);
                    let curY = r + Math.random() * (this.D - 2 * r);
                    
                    for (let j = 0; j < 5; j++) {
                        let step = 0.2;
                        let neighbors = [
                            {x: curX, y: curY},
                            {x: curX + step, y: curY}, {x: curX - step, y: curY},
                            {x: curX, y: curY + step}, {x: curX, y: curY - step}
                        ];
                        for (let n of neighbors) {
                            if (n.x < r || n.x > this.W - r || n.y < r || n.y > this.D - r) continue;
                            let z = this.getZAt(n.x, n.y, r);
                            if (z < bestZ) {
                                bestZ = z; bestX = n.x; bestY = n.y;
                                curX = n.x; curY = n.y;
                            }
                        }
                    }
                }

                if (bestZ + r <= this.H) {
                    this.spheres.push({x: bestX, y: bestY, z: bestZ, r: r});
                    return true;
                }
                return false;
            }

            calculateScopingDensity(sxR, syR, szR, gridRes = 25) {
                const [xMin, xMax] = sxR;
                const [yMin, yMax] = syR;
                const [zMin, zMax] = szR;

                let insideCount = 0;
                const totalPoints = gridRes * gridRes * gridRes;

                for (let i = 0; i < gridRes; i++) {
                    const px = xMin + (i + 0.5) * (xMax - xMin) / gridRes;
                    for (let j = 0; j < gridRes; j++) {
                        const py = yMin + (j + 0.5) * (yMax - yMin) / gridRes;
                        for (let k = 0; k < gridRes; k++) {
                            const pz = zMin + (k + 0.5) * (zMax - zMin) / gridRes;
                            
                            for (const s of this.spheres) {
                                const d2 = Math.pow(px - s.x, 2) + Math.pow(py - s.y, 2) + Math.pow(pz - s.z, 2);
                                if (d2 <= s.r * s.r) {
                                    insideCount++;
                                    break;
                                }
                            }
                        }
                    }
                }
                return insideCount / totalPoints;
            }
        }

        // --- Three.js Scene Setup ---
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111111);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(20, 20, 20);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
        scene.add(ambientLight);
        const pointLight = new THREE.PointLight(0xffffff, 100);
        pointLight.position.set(20, 30, 10);
        scene.add(pointLight);

        let boxMesh, instancedSpheres, scopeMesh;
        let currentPacker;

        function updateScope() {
            if (!currentPacker) return;

            let sxMin = parseFloat(document.getElementById('input-sx-min').value);
            let sxMax = parseFloat(document.getElementById('input-sx-max').value);
            let syMin = parseFloat(document.getElementById('input-sy-min').value);
            let syMax = parseFloat(document.getElementById('input-sy-max').value);
            let szMin = parseFloat(document.getElementById('input-sz-min').value);
            let szMax = parseFloat(document.getElementById('input-sz-max').value);

            // Ensure min <= max
            if (sxMin > sxMax) { sxMin = sxMax; document.getElementById('input-sx-min').value = sxMin; }
            if (syMin > syMax) { syMin = syMax; document.getElementById('input-sy-min').value = syMin; }
            if (szMin > szMax) { szMin = szMax; document.getElementById('input-sz-min').value = szMin; }

            // Update UI Labels
            document.getElementById('val-sx').innerText = `${sxMin} - ${sxMax}`;
            document.getElementById('val-sy').innerText = `${syMin} - ${syMax}`;
            document.getElementById('val-sz').innerText = `${szMin} - ${szMax}`;

            // Clear old scope mesh
            if (scopeMesh) scene.remove(scopeMesh);

            // Create Scope Wireframe
            const sw = sxMax - sxMin;
            const sh = szMax - szMin;
            const sd = syMax - syMin;
            if (sw > 0 && sh > 0 && sd > 0) {
                const scopeGeo = new THREE.BoxGeometry(sw, sh, sd);
                const scopeEdges = new THREE.EdgesGeometry(scopeGeo);
                scopeMesh = new THREE.LineSegments(scopeEdges, new THREE.LineBasicMaterial({ color: 0xf87171, linewidth: 2 }));
                scopeMesh.position.set(sxMin + sw/2, szMin + sh/2, syMin + sd/2);
                scene.add(scopeMesh);
            }

            // Update Scoping Density
            const scopeRatio = currentPacker.calculateScopingDensity([sxMin, sxMax], [syMin, syMax], [szMin, szMax]) * 100;
            document.getElementById('stat-scope-ratio').innerText = scopeRatio.toFixed(2) + "%";
        }

        function updateScene() {
            const W = parseFloat(document.getElementById('input-w').value);
            const D = parseFloat(document.getElementById('input-d').value);
            const H = parseFloat(document.getElementById('input-h').value);
            const R = parseFloat(document.getElementById('input-r').value);
            const RSig = parseFloat(document.getElementById('input-rsig').value);
            const N = parseInt(document.getElementById('input-n').value);

            // Update UI Labels for Box
            document.getElementById('val-w').innerText = W;
            document.getElementById('val-d').innerText = D;
            document.getElementById('val-h').innerText = H;
            document.getElementById('val-r').innerText = R;
            document.getElementById('val-rsig').innerText = RSig;
            document.getElementById('val-n').innerText = N;

            // Clear old objects
            if (boxMesh) scene.remove(boxMesh);
            if (instancedSpheres) scene.remove(instancedSpheres);

            // Create Box Wireframe
            const boxGeo = new THREE.BoxGeometry(W, H, D);
            const edges = new THREE.EdgesGeometry(boxGeo);
            boxMesh = new THREE.LineSegments(edges, new THREE.LineBasicMaterial({ color: 0x555555 }));
            boxMesh.position.set(W/2, H/2, D/2);
            scene.add(boxMesh);

            // Run Packing
            currentPacker = new SpherePacker(W, D, H, R, RSig);
            for (let i = 0; i < N; i++) {
                currentPacker.addSphere();
            }

            // Visualize Spheres
            const sphereGeo = new THREE.SphereGeometry(1, 24, 16); 
            const sphereMat = new THREE.MeshPhongMaterial({ color: 0x3b82f6, shininess: 80, transparent: true, opacity: 0.8 });
            instancedSpheres = new THREE.InstancedMesh(sphereGeo, sphereMat, currentPacker.spheres.length);
            
            const dummy = new THREE.Object3D();
            let maxTopHeight = 0;
            let totalSphereVol = 0;
            currentPacker.spheres.forEach((s, i) => {
                dummy.position.set(s.x, s.z, s.y); 
                dummy.scale.set(s.r, s.r, s.r);
                dummy.updateMatrix();
                instancedSpheres.setMatrixAt(i, dummy.matrix);
                maxTopHeight = Math.max(maxTopHeight, s.z + s.r);
                totalSphereVol += (4/3 * Math.PI * Math.pow(s.r, 3));
            });
            scene.add(instancedSpheres);

            // Update Stats
            const boxVol = W * D * maxTopHeight;
            const ratio = boxVol > 0 ? (totalSphereVol / boxVol) * 100 : 0;

            document.getElementById('stat-count').innerText = currentPacker.spheres.length;
            document.getElementById('stat-height').innerText = maxTopHeight.toFixed(2);
            document.getElementById('stat-ratio').innerText = ratio.toFixed(2) + "%";

            // Update Scope visualization and stats
            updateScope();

            controls.target.set(W/2, H/2, D/2);
            camera.lookAt(W/2, H/2, D/2);
        }

        // --- Event Listeners ---
        document.getElementById('btn-generate').addEventListener('click', updateScene);

        // Box configuration sliders
        ['input-w', 'input-d', 'input-h', 'input-r', 'input-rsig', 'input-n'].forEach(id => {
            document.getElementById(id).addEventListener('input', () => {
                const suffix = id.split('-')[1];
                document.getElementById('val-' + suffix).innerText = document.getElementById(id).value;
            });
        });

        // Scoping configuration sliders - Real-time updates
        ['input-sx-min', 'input-sx-max', 'input-sy-min', 'input-sy-max', 'input-sz-min', 'input-sz-max'].forEach(id => {
            document.getElementById(id).addEventListener('input', updateScope);
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        updateScene();
        animate();
    </script>
</body>
</html>
